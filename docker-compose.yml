version: '3.8'

services:
  edge-converter:
    build: .
    volumes:
      - ./config:/app/config
      - ./credentials:/app/credentials
      - ./checkpoint:/app/checkpoint
      - ./session:/app/session
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kuala_Lumpur
      - RUN_ON_STARTUP=true
    restart: unless-stopped
